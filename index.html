<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/jpeg" href="Dostoyevski.jpg">
    <link href="https://afeld.github.io/emoji-css/emoji.css" rel="stylesheet">
    <script src="https://unpkg.com/twemoji@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KPM9RH2MP5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KPM9RH2MP5');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaid Notebook</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            /* ===== نظام الألوان: أبيض وأسود نقي وحاد (Monochrome Theme) ===== */
            --bg-main:     #050505;
            --card-bg:     #0d0d11;
            --card-hover:  #141419;
            
            --border-dim:  rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 255, 255, 0.25);
            
            --text-pure:   #ffffff;
            --text-muted:  #a1a1aa;
            --text-sub:    #52525b;

            --font-display: 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --font-mono:    'IBM Plex Mono', ui-monospace, monospace;
        }

        * { box-sizing: border-box; }

        img.emoji {
            height: 1em;
            width: 1em;
            margin: 0 .05em 0 .1em;
            vertical-align: -0.1em;
        }

        html { scroll-padding-top: 24px; }

        body {
            font-family: var(--font-display);
            background: var(--bg-main);
            /* إضاءة خلفية ناعمة جداً باللون الأبيض في المنتصف */
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.05), transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(255, 255, 255, 0.02), transparent 80%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-pure);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 100px;
        }

        .container { max-width: 580px; width: 100%; }

        /* ===== الترويسة ===== */
        header {
            text-align: center;
            margin-bottom: 52px;
            margin-top: 10px;
            position: relative;
        }

        header .eyebrow-line {
            width: 40px;
            height: 2px;
            margin: 0 auto 20px;
            border-radius: 2px;
            background: var(--text-pure);
            opacity: 0.8;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        header h1 {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin: 0 0 8px;
            color: var(--text-pure);
            text-transform: uppercase;
        }

        header p.tagline {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin: 0;
            font-weight: 500;
            letter-spacing: 0.03em;
        }

        /* ===== بطاقات المنشورات ===== */
        #loading-msg {
            text-align: center;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.88rem;
            padding: 40px 0;
            letter-spacing: 0.05em;
        }

        .post {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--border-dim);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
        }

        .post:hover {
            background: var(--card-hover);
            border-color: var(--border-glow);
            transform: translateY(-3px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 255, 255, 0.03);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .avatar-ring {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            padding: 1px;
            background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.1));
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--bg-main);
            border: 2px solid var(--bg-main);
            display: block;
        }

        .author-info { display: flex; flex-direction: column; }
        .author-name { 
            font-weight: 700; 
            color: var(--text-pure); 
            font-size: 1.02rem; 
        }

        .post-date {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            display: none !important;
        }

        .post-text {
            line-height: 1.8;
            font-size: 1rem;
            color: #e4e4e7;
            white-space: pre-wrap;
            font-weight: 400;
        }

        .post-image {
            width: 100%;
            border-radius: 12px;
            margin-top: 18px;
            border: 1px solid var(--border-dim);
            display: block;
            filter: brightness(0.95);
            transition: filter 0.3s ease;
        }

        .post:hover .post-image {
            filter: brightness(1);
        }

        footer {
            margin-top: 60px;
            font-size: 0.8rem;
            color: var(--text-sub);
            font-family: var(--font-mono);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        @media (prefers-reduced-motion: reduce) {
            .post { transition: none; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="eyebrow-line"></div>
            <h1>Zaid room</h1>
            <p class="tagline">دفتر ملاحظات زيد</p>
        </header>
        <div id="dynamic-posts">
            <p id="loading-msg">جاري تحميل المنشورات...</p>
        </div>
    </div>

    <footer>© 2026 from zaid</footer>

    <script>
        async function fetchDynamicPosts() {
            const dynamicContainer = document.getElementById('dynamic-posts');
            const apiUrl = `https://api.github.com/repos/rnew8846-afk/bio/contents/_posts`;

            try {
                const response = await fetch(apiUrl);
                const files = await response.json();
                const mdFiles = files.filter(f => f.name.endsWith(".md"));
                let postsData = [];

                for (const file of mdFiles) {
                    const postRes = await fetch(file.download_url);
                    const content = await postRes.text();

                    const title = (content.match(/title:\s*["']?(.*?)["']?(\r?\n|$)/))?.[1] || "صديق";
                    let dateStr = (content.match(/date:\s*(.*?)(\r?\n|$)/))?.[1] || "";
                    const avatar = (content.match(/avatar:\s*(.*?)(\r?\n|$)/))?.[1] || 'zaidpfp.jpeg';
                    const image = (content.match(/image:\s*(.*?)(\r?\n|$)/))?.[1] || null;
                    const body = content.split("---").pop().trim();

                    let finalDate;
                    if (!dateStr || dateStr.includes("{{now}}")) {
                        finalDate = new Date();
                    } else {
                        finalDate = new Date(dateStr);
                    }

                    postsData.push({
                        title: title.trim(),
                        date: finalDate,
                        dateDisplay: finalDate.toLocaleString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
                        avatar: avatar.trim(),
                        image: image ? image.trim() : null,
                        body
                    });
                }

                postsData.sort((a, b) => b.date - a.date);

                dynamicContainer.innerHTML = "";
                postsData.forEach(post => {
                    const postHtml = `
                        <div class="post">
                            <div class="post-header">
                                <div class="avatar-ring">
                                    <img src="${post.avatar}" class="avatar" onerror="this.src='zaidpfp.jpeg'">
                                </div>
                                <div class="author-info">
                                    <span class="author-name">${post.title}</span>
                                    <span class="post-date">${post.dateDisplay}</span>
                                </div>
                            </div>
                            <div class="post-text">${post.body}</div>
                            ${post.image ? `<img src="${post.image}" class="post-image">` : ""}
                        </div>
                    `;
                    dynamicContainer.innerHTML += postHtml;
                });

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loading-msg').innerText = "فشل تحميل المنشورات.";
            }
        }
        fetchDynamicPosts();
    </script>

    <script>
        const observer = new MutationObserver(() => {
            twemoji.parse(document.body, { folder: 'svg', ext: '.svg' });
        });
        observer.observe(document.body, { childList: true, subtree: true });
        window.onload = () => twemoji.parse(document.body, { folder: 'svg', ext: '.svg' });
    </script>

</body>
</html>
